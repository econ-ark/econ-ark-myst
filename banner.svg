    stretched to the width of a banner. Each path is the centreline of one curve in
    Econ-Ark_Logo_1536x768px.eps, rebuilt at banner proportions with the logo's own
    taper and a pen that stays even across the stretch. Drawing them this way keeps
    what the logo says: the curves leave one origin, each kinks where it stops being
    bound by the constraint, and the kinks sit on one line.
