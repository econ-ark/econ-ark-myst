<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 445" width="1600" height="445" role="img" aria-label="Four consumption functions in the Econ-ARK colours, their kinks along one line, on a deep blue field">
  <!--
    The default banner for an Econ-ARK paper. Four consumption functions climb while the
    constraint binds, leave it at their own kinks, and flatten towards their asymptotes,
    in the colours and the order of the logo curves. A kink is where a curve leaves the
    line c = m, which is why the four sit on one straight line, here and in the logo.
    article-theme lays its title card over the middle of a banner, so the kinks and the
    tails fall in the frame the card leaves open.
  -->
  <rect width="1600" height="445" fill="#1f476b"/>
  <g fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="miter" opacity="0.95">
    <path d="M 710 520 L 800 438 C 950 420 1250 402 1620 390" stroke="#39b54a"/>
    <path d="M 750 494 L 840 412 C 1000 390 1300 366 1620 350" stroke="#00aeef"/>
    <path d="M 790 468 L 880 386 C 1060 360 1350 330 1620 310" stroke="#ed217c"/>
    <path d="M 830 442 L 920 360 C 1120 328 1400 294 1620 270" stroke="#fcb040"/>
  </g>
</svg>
