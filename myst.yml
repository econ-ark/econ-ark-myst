version: 1
project:
  github: https://github.com/econ-ark/econ-ark-myst
  # article-theme draws its header from the project, so a doi or a date written in the paper
  # reaches the export alone. MyST hands each field below down to the paper, leaving one copy to
  # edit; subtitle it does not hand down, so the paper carries its own, as it does for downloads.
  subtitle: An example of the Econ-ARK MyST template
  date: 2026-09-16
  subject: Working paper
  doi: 10.5281/zenodo.0000000
  arxiv: https://arxiv.org/abs/2609.00000
  zenodo: https://zenodo.org/records/0000000
  binder: https://mybinder.org/v2/gh/econ-ark/econ-ark-myst/HEAD
  open_access: true
  venue:
    title: Econ-ARK Working Papers
  # article-theme prints volume.title and the Typst template reads volume.number, so both are set
  volume:
    number: 1
    title: '1'
  issue:
    number: 3
    title: '3'
  first_page: 1
  last_page: 3
  banner: banner.svg
  description: A worked example of the Econ-ARK MyST template, with every part it supports
  source: https://github.com/econ-ark/econ-ark-myst
  reviewers:
    - name: Rita Referee
  editors:
    - name: Eddie Editor
  license:
    content: CC-BY-4.0
    code: MIT
  funding:
    - statement: Support from the Alfred P. Sloan Foundation is gratefully acknowledged
      awards:
        - id: G-2026-00001
          name: Computational Economics Grant
  bibliography:
    - examples/main.bib
  # fira-math re-renders equations as MathML Core, which is what lets theme.css set them in Fira
  # Math; part-wrapper gives the parts with no backmatter slot a class theme.css can label
  plugins:
    - plugins/fira-math.mjs
    - plugins/part-wrapper.mjs
  # theme.css asks for these by relative path, and MyST copies them beside it
  static_files:
    - fonts
  # article-theme reads its downloads panel from the project, not from the paper's own
  # frontmatter, so a paper that lists downloads still needs them named here to reach the site
  downloads:
    - file: examples/exports/paper.pdf
      title: Latest version
    - file: examples/paper.bib
      title: BibTeX
  # Without a table of contents MyST would take the README for a page of the site
  toc:
    - file: examples/paper.md
    - file: examples/tall-table.md
    - file: examples/minimal.md
  authors:
    - name: Jane Economist
      email: jane@example.org
      corresponding: true
      note: Also a visiting scholar at Econ-ARK.
      orcid: 0000-0002-7859-8394
      affiliations:
        - id: jhu
          institution: Johns Hopkins University
          department: Department of Economics
          ror: 00za53h95
    - name: John Modeler
      equal_contributor: true
      affiliations:
        - jhu
        - id: econark
          name: Econ-ARK
site:
  template: article-theme
  options:
    logo: logo.png
    logo_dark: logo-dark.png
    logo_text: Econ-ARK
    logo_url: https://econ-ark.org
    logo_alt: Econ-ARK
    favicon: favicon.png
    style: theme.css
  nav:
    - title: Econ-ARK
      url: https://econ-ark.org
