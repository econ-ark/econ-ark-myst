version: 1
# The site that sits above the two theme demos. It is its own MyST project so that it can take
# book-theme, which is the only theme carrying the landing-page block renderers, while the paper
# demo at ../myst.yml stays on article-theme. Everything it is dressed in comes from one level up.
project:
  title: Econ-ARK
  # Only book-theme carries landing blocks, and it paints no banner the way article-theme does.
  # This still earns its place: it is what fills og:image, the card a shared link renders. The
  # banner a reader sees is the image at the top of index.md.
  banner: ../brand/banner.svg
  # The equations in the blocks below are set in Fira Math by the same plugin the paper uses
  plugins:
    - ../plugins/fira-math.mjs
  static_files:
    - ../fonts
    # theme.css is served as /myst-theme.css and paints the hero with url("banner.svg"), resolved
    # against itself. A static file is served at its basename, so this lands beside it.
    - ../brand/banner.svg
  toc:
    - file: index.md
site:
  template: book-theme
  options:
    # As in ../myst.yml: the wordmark carries the name, and the header's one link belongs to this
    # site, which is where an unset logo_url sends it
    logo: ../brand/logo.png
    logo_dark: ../brand/logo-dark.png
    logo_alt: Econ-ARK
    favicon: ../brand/favicon.png
    style: ../theme.css
  # The two demos are separate MyST projects, so nav cannot reach them without naming the host.
  # The buttons in the hero link them relatively, which works locally and under the Pages prefix.
  nav:
    - title: GitHub
      url: https://github.com/econ-ark/econ-ark-myst
