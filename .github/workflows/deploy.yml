name: Deploy the example site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a run in progress finish rather than cancelling it midway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install mystmd
        run: |
          npm install -g mystmd@1.11.0
          npm install

      # theme.css asks for faces that are not in the repository, so the deploy makes them
      - name: Build the webfonts
        run: |
          pip install --quiet fonttools brotli
          scripts/fonts.sh webfonts

      - uses: actions/configure-pages@v6

      # Three sites from one stylesheet: the landing page at the root, the paper under each theme.
      # An asset href carries the sub-path it is served from, so each build sets its own BASE_URL.
      # The book build copies the tree and swaps the template, as check-examples.sh does.
      - name: Build the three sites
        env:
          REPO: /${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p pages

          BASE_URL=$REPO/article myst build --html
          cp -r _build/html pages/article

          other=$(mktemp -d)
          tar -c --exclude=_build --exclude=.git --exclude=./node_modules --exclude=./pages . |
            tar -x -C "$other"
          ln -s "$PWD/node_modules" "$other/node_modules"
          sed -i 's/template: article-theme/template: book-theme/' "$other/myst.yml"
          (cd "$other" && BASE_URL=$REPO/book myst build --html)
          cp -r "$other/_build/html" pages/book

          # book-theme is the only one carrying the landing-page block renderers
          (cd landing && BASE_URL=$REPO myst build --html)
          cp -r landing/_build/html/. pages/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: pages

      - id: deployment
        uses: actions/deploy-pages@v5
