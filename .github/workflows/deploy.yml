name: Deploy the example site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and let a run in progress finish rather than cancelling it midway
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install mystmd
        run: |
          npm install -g mystmd@1.10.1
          npm install

      # theme.css asks for faces that are not in the repository, so the deploy makes them.
      # It runs after npm install because it takes Temml's stylesheet from node_modules.
      - name: Build the webfonts
        run: |
          pip install --quiet fonttools brotli
          scripts/fonts.sh webfonts

      - uses: actions/configure-pages@v5

      # The site is served from a subpath, so the assets have to be written with it
      - name: Build the site
        env:
          BASE_URL: /${{ github.event.repository.name }}
        run: myst build --html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html

      - id: deployment
        uses: actions/deploy-pages@v4
