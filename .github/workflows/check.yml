name: Check examples

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Versions match the local builds that produced the tracked example PDF
      - name: Install mystmd and Typst
        run: |
          npm install -g mystmd@1.10.1
          curl -sL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz \
            | sudo tar -xJ --strip-components=1 -C /usr/local/bin typst-x86_64-unknown-linux-musl/typst
          typst --version

      # Without these fonts the template falls back to bundled ones, which changes line breaks.
      # Every weight the template asks for has a file here, so none resolves by discovery order.
      - name: Install fonts and poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils imagemagick unzip
          mkdir -p ~/.local/share/fonts
          curl -sL -o fira.zip https://github.com/mozilla/Fira/archive/refs/tags/4.202.zip
          unzip -q -j fira.zip '*/otf/FiraSans-Regular.otf' '*/otf/FiraSans-Italic.otf' \
            '*/otf/FiraSans-Medium.otf' '*/otf/FiraSans-MediumItalic.otf' \
            '*/otf/FiraSans-SemiBold.otf' '*/otf/FiraSans-SemiBoldItalic.otf' \
            '*/otf/FiraSans-Bold.otf' '*/otf/FiraSans-BoldItalic.otf' \
            '*/otf/FiraMono-Regular.otf' '*/otf/FiraMono-Medium.otf' '*/otf/FiraMono-Bold.otf' \
            -d ~/.local/share/fonts
          curl -sL -o ~/.local/share/fonts/FiraMath-Regular.otf \
            https://github.com/firamath/firamath/releases/download/v0.3.4/FiraMath-Regular.otf
          fc-cache -f
          # Each family must be found, or the build falls back to a bundled font and the tracked PDF changes
          test "$(typst fonts | grep -cE '^(Fira Sans|Fira Mono|Fira Math)$')" -eq 3

      - name: Report which font files Typst can see
        run: |
          echo '--- files whose family is one of ours'
          fc-list : file family | grep -iE 'fira' | sort
          echo '--- what Typst resolves'
          typst fonts --variants | grep -iA4 -E '^Fira'

      - name: Self-test the checks
        run: |
          myst build --typst
          scripts/check-examples.sh --self-test

      - name: Build and check the examples
        run: scripts/check-examples.sh

      # The tracked PDF has to reproduce here, so when it does not, keep what this runner built
      - name: Keep the PDF this runner built
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paper-built-on-the-runner
          path: examples/exports/paper.pdf
