myst: v1
kind: typst
title: Econ-ARK Template
description: Econ-ARK working paper and technical report template
template: template.typ
files:
  - template.typ
  - econark.typ
  - logo.png
authors:
  - name: Alan Lujan
    github: alanlujan91
    affiliations:
      - Econ-ARK
version: 0.1.0
license: MIT
source: https://github.com/curvenote-templates/openrxivlabs
tags:
  - preprint
  - article
  - paper
  - economics
thumbnail: ./thumbnail.png
github: https://github.com/econ-ark/econ-ark-myst
doc:
  - id: title
    required: true
  - id: authors
    required: true
  - id: affiliations
  - id: subtitle
  - id: short_title
  - id: date
    description: Shown in the margin; MyST uses the build date when it is unset
  - id: license
    description: The content license shows in the margin; a separate code license shows under the code link in the materials block
  - id: copyright
    description: Copyright holder, replacing the author names in the margin's copyright line
  - id: funding
    description: Funding statements and awards, added to the starred title footnote; write it as a list
  - id: numbering
    description: "headings: false turns heading numbers off"
  - id: bibliography
  - id: venue
  - id: open_access
  - id: keywords
  - id: tags
    description: JEL classification codes, shown under the keywords (same field as the Econometric Society template)
  - id: subject
    description: Kind of paper, shown above the date in the margin, for example "Working paper" or "REMARK"
  - id: doi
    description: Shown in the "Cite as" block in the margin
  - id: arxiv
    description: arXiv URL, shown in the "Cite as" block
  - id: zenodo
    description: Zenodo archive URL, shown in the "Cite as" block
  - id: volume
  - id: issue
  - id: github
  - id: binder
  - id: downloads
    description: Other formats of the paper, linked in the materials block; a web address ending in .bib goes to "Cite as" as BibTeX
  - id: first_page
  - id: last_page
options:
  - id: kind
    type: string
    description: Label shown above the date in the margin, overriding the subject field
  - id: linenumbers
    type: boolean
    description: Number the lines of the main text, for review drafts
    default: false
  - id: figure_placement
    type: choice
    choices:
      - none
      - auto
      - top
      - bottom
    default: none
    description: >
      none keeps each figure and table where it is written. auto, top and bottom float those that fit a page
      to that end of a page, so the text fills the space they would leave. A table taller than a page stays
      in the text. placeNextFigure in a raw Typst block sets one figure's placement.
  - id: remark
    type: string
    description: Name of the paper's REMARK on econ-ark.org, such as "LiqConstr", linked in the materials block
  - id: binder_label
    type: string
    description: Label over the binder link in the materials block, such as "Dashboard"; defaults to "Run online"
parts:
  - id: abstract
    description: >
      An abstract is a short summary of your research paper or report.
    max_words: 500
  - id: summary
    description: Non-technical summary, shown after the abstract.
    max_words: 300
  - id: keypoints
    description: >
      Three or four short bullet points, shown in the margin under the logo,
      or under the abstract when the margin has no room.
    max_words: 80
  - id: acknowledgments
    description: Acknowledgments, shown unnumbered after the main text.
  - id: data_availability
    description: Data availability statement, shown unnumbered after the acknowledgments.
  - id: declaration
    description: Declaration of competing interest, shown unnumbered after the data availability statement.
  - id: ai_declaration
    description: >
      Declaration of generative AI use, shown unnumbered immediately before the references.
      Same part name as the elsarticle-myst template; supply only the statement text.
  - id: title_note
    description: Footnote attached to the title, such as a funding or presentation note; author notes follow it.
