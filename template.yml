myst: v1
kind: typst
title: Econ-ARK Template
description: Econ-ARK working paper and technical report template
template: template.typ
files:
  - template.typ
  - econ-ark.typ
  # MyST copies a listed file into the build directory with its prefix intact, so every path here
  # resolves in the build exactly as it is written in the file that imports it.
  - ark/subpar.typ
  - ark/brand.typ
  - ark/layout.typ
  - ark/figures.typ
  - ark/tables.typ
  - ark/frontmatter.typ
  - ark/blocks.typ
  - ark/typography.typ
  - ark/floats.typ
  - brand/logo.png
  - brand/code.tmTheme
authors:
  - name: Alan Lujan
    github: alanlujan91
    affiliations:
      - Econ-ARK
version: 0.1.0
license: MIT
source: https://github.com/curvenote-templates/openrxivlabs
tags:
  - preprint
  - article
  - paper
  - economics
thumbnail: ./brand/thumbnail.png
github: https://github.com/econ-ark/econ-ark-myst
doc:
  - id: title
    required: true
  - id: authors
    required: true
  - id: affiliations
  - id: subtitle
  - id: short_title
  - id: date
    description: Shown in the margin; MyST uses the build date when it is unset
  - id: license
    description: The content license shows in the margin; a separate code license shows under the code link in the materials block
  - id: copyright
    description: Copyright holder, replacing the author names in the margin's copyright line
  - id: funding
    description: Funding statements and awards, shown in the margin rail; write it as a list
  - id: numbering
    description: "headings: false turns heading numbers off"
  - id: bibliography
  - id: venue
  - id: open_access
  - id: keywords
  - id: tags
    description: JEL classification codes, shown under the keywords (same field as the Econometric Society template)
  - id: subject
    description: Kind of paper, shown above the date in the margin, for example "Working paper" or "REMARK"
  - id: doi
    description: Shown in the "Cite as" block in the margin
  - id: arxiv
    description: arXiv URL, shown in the "Cite as" block
  - id: zenodo
    description: Zenodo archive URL, shown in the "Cite as" block
  - id: volume
  - id: issue
  - id: github
  - id: binder
  - id: downloads
    description: Other formats of the paper, linked in the materials block; a web address ending in .bib goes to "Cite as" as BibTeX
  - id: first_page
  - id: last_page
  - id: source
    description: Where the work itself lives, taking the Code column of the materials block in place of github when both are set
  - id: reviewers
    description: Reviewers, listed in the margin under the funding
  - id: editors
    description: Editors, listed in the margin under the reviewers
options:
  - id: kind
    type: string
    description: Label shown above the date in the margin, overriding the subject field
  - id: linenumbers
    type: boolean
    description: Number the lines of the main text, for review drafts
    default: false
  - id: figure_placement
    type: choice
    choices:
      - none
      - auto
      - top
      - bottom
    default: none
    description: >
      none keeps each figure and table where it is written. auto, top and bottom float those that fit a page
      to that end of a page, so the text fills the space they would leave. A table taller than a page stays
      in the text. placeNextFigure in a raw Typst block sets one figure's placement.
  - id: remark
    type: string
    description: Name of the paper's REMARK on econ-ark.org, such as "LiqConstr", linked in the materials block
  - id: binder_label
    type: string
    description: Label over the binder link in the materials block, such as "Dashboard"; defaults to "Run online"
  - id: wide_figures
    type: string
    description: >
      Labels of the figures that span the margin rail as well as the text column, separated by
      commas or spaces. A figure named here needs no widenNextFigure call before it. A table's
      columns still share the wider measure only under widenNextFigure, which is what the table
      reads as it is laid out.
  - id: appendix_from
    type: string
    description: >
      Label of the heading the appendices start at, written in the page as (label)= before the
      heading. The back matter and the references print before it and every heading from there on
      is lettered, which is what an <appendix> marker in a raw Typst block does.
  - id: twinned_tables
    type: string
    description: >
      Tables whose Typst twin is the copy to print, for a table written as a fragment that carries
      both a LaTeX float MyST parses and a Typst twin. Write "all" when every parsed table has a
      twin, or the labels of the ones that do, separated by commas or spaces. The parsed copy is
      hidden rather than dropped, so a cross-reference to it still resolves, and the twin takes its
      number so one sequence numbers every table.
  - id: site_url
    type: string
    description: >
      Where the MyST site is served, such as "https://econ-ark.org". A page exported on its own
      links the project's other pages by path, which no PDF can follow: set this and each such link
      goes to the site, leave it unset and each prints as its text. A reference to a label on
      another page prints as its text either way, since MyST does not say which page holds it.
parts:
  - id: abstract
    description: >
      An abstract is a short summary of your research paper or report.
    max_words: 500
  - id: summary
    description: Non-technical summary, shown after the abstract.
    max_words: 300
  - id: keypoints
    description: >
      Three or four short bullet points, shown in the margin under the logo,
      or under the abstract when the margin has no room.
    max_words: 80
  - id: dedication
    description: Dedication, centred on its own after the front matter and before the first heading.
    max_words: 50
  - id: epigraph
    description: >
      Epigraph, set as a quotation from the right after the dedication; write the attribution
      into the text.
    max_words: 100
  - id: acknowledgments
    description: Acknowledgments, shown unnumbered after the main text.
  - id: data_availability
    description: Data availability statement, shown unnumbered after the acknowledgments.
  - id: declaration
    description: >
      Declarations, shown unnumbered at the head of the back matter, before the acknowledgments.
      One block for competing interests, generative AI use and anything else a working paper has
      to state; a journal submission uses that journal's own template.
